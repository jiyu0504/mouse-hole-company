<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>같이갈개 · 반려동물 동반 카페 찾기</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <!-- 공통 헤더: 로고 자리 + (카페 상세에서만) 찜하기 버튼 -->
    <header class="topbar">
      <button type="button" class="brand" data-go="home" aria-label="같이갈개 홈으로"><span class="ph logo-ph"></span></button>
      <div id="headerSlot"></div>
    </header>

    <main>
      <!-- 홈 : 추천 카페 -->
      <section id="home" class="view warm">
        <h1 class="page-title">추천 카페</h1>
        <p class="page-sub">오늘의 추천 카페</p>
        <div id="homeCards" class="stack"></div>
      </section>

      <!-- 카페 목록 (하단 ☰) -->
      <section id="cafes" class="view">
        <div class="select-row">
          <button type="button" class="reset-btn" data-reset>초기화</button>
          <div id="ddCafeRegion" class="dd light"></div>
          <button type="button" class="line-btn" data-go="filter" data-from="cafes">세부조건선택<span class="badge" data-filter-count hidden></span></button>
        </div>
        <div class="title-bar"><span>추천 카페</span><span class="count" id="cafeCount"></span></div>
        <div id="cafeResults" class="stack"></div>
      </section>

      <!-- 명소 목록 (하단 나무) -->
      <section id="attractions" class="view">
        <div class="select-row">
          <button type="button" class="reset-btn" data-reset>초기화</button>
          <div id="ddPlaceRegion" class="dd light"></div>
          <button type="button" class="line-btn" data-go="filter" data-from="attractions">세부조건선택<span class="badge" data-filter-count hidden></span></button>
        </div>
        <div class="title-bar"><span>추천 명소</span><span class="count" id="placeCount"></span></div>
        <div id="placeResults" class="stack"></div>
      </section>

      <!-- 세부조건 선택 -->
      <section id="filter" class="view">
        <div class="filter-panel">
          <div class="dd-pair">
            <div id="ddFilterRegion" class="dd dark"></div>
            <div id="ddFilterDong" class="dd dark"></div>
          </div>
          <h2 class="filter-title">동반 조건</h2>
          <div id="filterGroups"></div>
        </div>
        <button type="button" class="btn wide" id="filterApply">결과 보기</button>
      </section>

      <!-- 카페 / 명소 상세 -->
      <section id="detail" class="view">
        <div id="detailContent"></div>
      </section>

      <!-- 방문 후기 작성 -->
      <section id="reviewForm" class="view">
        <form id="reviewFormEl" novalidate>
          <div class="panel review-panel">
            <h2>방문 후기 작성</h2>
            <p class="hint">솔직한 후기~</p>

            <span class="field-label" id="starLabel">별점</span>
            <div class="star-select" id="starSelect">
              <button type="button" class="star-toggle" id="starToggle" aria-haspopup="true" aria-expanded="false" aria-labelledby="starLabel starText">
                <span id="starText" class="star-text"></span><span class="dd-caret" aria-hidden="true">▼</span>
              </button>
              <div class="star-list" id="starList" role="radiogroup" aria-labelledby="starLabel" hidden></div>
            </div>

            <label class="field-label" for="reviewContent">후기 내용</label>
            <textarea id="reviewContent" maxlength="500" required></textarea>

            <label class="field-label" for="reviewImage">방문 사진</label>
            <input id="reviewImage" class="file-box" type="file" accept="image/*">
          </div>
          <button type="submit" class="btn wide">등록하기</button>
        </form>
      </section>

      <!-- 로그인 -->
      <section id="login" class="view">
        <form id="loginForm" class="auth-form">
          <div class="auth-panel">
            <div class="ph auth-img" aria-hidden="true"></div>
            <label for="loginId" class="bar-label">아이디</label>
            <input id="loginId" required autocomplete="username">
            <label for="loginPassword" class="bar-label">비밀번호</label>
            <input id="loginPassword" type="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn wide">로그인하기</button>
          <button type="button" class="btn wide" data-go="signup">회원가입</button>
        </form>
      </section>

      <!-- 회원가입 -->
      <section id="signup" class="view">
        <form id="signupForm" class="auth-form">
          <div class="auth-panel">
            <div class="ph auth-img" aria-hidden="true"></div>
            <label for="signupId" class="bar-label">아이디</label>
            <input id="signupId" required autocomplete="username">
            <label for="signupPassword" class="bar-label">비밀번호</label>
            <input id="signupPassword" type="password" required autocomplete="new-password">
            <label for="signupPasswordConfirm" class="bar-label">비밀번호 확인</label>
            <input id="signupPasswordConfirm" type="password" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn wide">회원가입</button>
          <button type="button" class="btn wide" data-go="login">로그인으로 돌아가기</button>
        </form>
      </section>

      <!-- MY -->
      <section id="profile" class="view">
        <div id="profileContent"></div>
      </section>

      <!-- 최근 본 매장 -->
      <section id="recent" class="view warm">
        <div class="title-bar">최근 본 매장</div>
        <div id="recentCards" class="stack"></div>
      </section>

      <!-- 찜한 매장 -->
      <section id="favorites" class="view warm">
        <div class="title-bar">찜한 매장</div>
        <div id="favoriteCards" class="stack"></div>
      </section>
    </main>
  </div>

  <!-- 하단 탭: 홈 / 카페 목록 / 명소 / 찜 / MY -->
  <nav class="bottom-nav" aria-label="하단 메뉴">
    <button type="button" data-go="home" data-tab="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg><span class="sr-only">홈</span>
    </button>
    <button type="button" data-go="cafes" data-tab="cafes">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="stroke"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="sr-only">카페 목록</span>
    </button>
    <button type="button" data-go="attractions" data-tab="attractions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.7 2 6 4.5 6 7.6c0 2.3 1.5 4.2 3.6 5.1L10 22h4l.4-9.3c2.1-.9 3.6-2.8 3.6-5.1C18 4.5 15.3 2 12 2z"/></svg><span class="sr-only">추천 명소</span>
    </button>
    <button type="button" data-go="favorites" data-tab="favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/></svg><span class="sr-only">찜한 매장</span>
    </button>
    <button type="button" data-go="profile" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="4.2"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8z"/></svg><span class="sr-only">마이페이지</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./js/script.js"></script>
</body>
</html>
